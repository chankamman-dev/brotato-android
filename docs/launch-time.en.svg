<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Noto Sans',sans-serif">
  <rect x="0.5" y="0.5" width="859" height="329" rx="14" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="28" y="40" font-size="16" font-weight="700" fill="#1f2328">Icon Tap to Save Loaded</text>
  <text x="28" y="62" font-size="12.5" fill="#6b7280">Measured on AYN Thor · Signed in to Steam · No pending game update</text>

  <!-- axis: x0 = 210, 18 px per second -->
  <g font-size="11" fill="#9aa3b2" text-anchor="middle">
    <line x1="210" y1="84" x2="210" y2="268" stroke="#eef0f3"/>
    <line x1="390" y1="84" x2="390" y2="268" stroke="#eef0f3"/>
    <line x1="570" y1="84" x2="570" y2="268" stroke="#eef0f3"/>
    <line x1="750" y1="84" x2="750" y2="268" stroke="#eef0f3"/>
    <text x="210" y="282">0s</text>
    <text x="390" y="282">10s</text>
    <text x="570" y="282">20s</text>
    <text x="750" y="282">30s</text>
  </g>

  <!-- row 1: everything one after another -->
  <text x="28" y="112" font-size="13.5" font-weight="700" fill="#1f2328">First Working Build</text>
  <text x="28" y="130" font-size="11.5" fill="#6b7280">Finish all sync before starting game</text>
  <rect x="210" y="100" width="216" height="24" rx="4" fill="#2f8cff"/>
  <rect x="428" y="100" width="45" height="24" rx="4" fill="#c3c8d1"/>
  <rect x="475" y="100" width="319" height="24" rx="4" fill="#f08a24"/>
  <text x="802" y="117" font-size="13" font-weight="700" fill="#1f2328">32 s</text>

  <!-- row 2: loading fixed -->
  <text x="28" y="172" font-size="13.5" font-weight="700" fill="#1f2328">After Fixing Pack Path</text>
  <text x="28" y="190" font-size="11.5" fill="#6b7280">Main pack loaded via user://</text>
  <rect x="210" y="160" width="228" height="24" rx="4" fill="#2f8cff"/>
  <rect x="440" y="160" width="66" height="24" rx="4" fill="#f08a24"/>
  <text x="514" y="177" font-size="13" font-weight="700" fill="#1f2328">16 s</text>

  <!-- row 3: in parallel -->
  <text x="28" y="230" font-size="13.5" font-weight="700" fill="#1f2328">Current Build</text>
  <text x="28" y="248" font-size="11.5" fill="#6b7280">Cloud sync &amp; Godot load in parallel</text>
  <rect x="210" y="219" width="81" height="13" rx="3" fill="#2f8cff"/>
  <rect x="210" y="236" width="72" height="13" rx="3" fill="#f08a24"/>
  <rect x="282" y="236" width="9" height="13" rx="2" fill="none" stroke="#f08a24" stroke-dasharray="2 2"/>
  <text x="300" y="239" font-size="13" font-weight="700" fill="#1f2328">4.5 s</text>

  <!-- legend -->
  <g font-size="12" fill="#4b5563">
    <rect x="160" y="300" width="12" height="12" rx="2" fill="#2f8cff"/>
    <text x="178" y="311">Steam Login &amp; Cloud Sync</text>
    <rect x="355" y="300" width="12" height="12" rx="2" fill="#c3c8d1"/>
    <text x="373" y="311">"Ready" Splash Pause</text>
    <rect x="520" y="300" width="12" height="12" rx="2" fill="#f08a24"/>
    <text x="538" y="311">Godot Engine Load (dashed: waiting for cloud save)</text>
  </g>
</svg>
