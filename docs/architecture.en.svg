<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171f"/>
      <stop offset="100%" stop-color="#1b202b"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#ff9e44"/>
    </marker>
  </defs>

  <rect width="880" height="450" rx="16" fill="url(#bg)" stroke="#2e3545" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="32" y="24" width="6" height="32" rx="3" fill="#2f8cff"/>
  <text x="50" y="46" font-size="18" font-weight="800" fill="#f3f5f8">No Game Assets in APK — Game Pack, Cloud Saves &amp; Workshop All Come from Steam</text>

  <!-- Column 1: Steam Servers -->
  <rect x="32" y="72" width="242" height="252" rx="12" fill="#1c212c" stroke="#343d4f" stroke-width="1.2"/>
  <rect x="32" y="72" width="242" height="42" rx="12" fill="#233247"/>
  <text x="50" y="98" font-size="14.5" font-weight="800" fill="#79c0ff">☁️ Steam Servers</text>
  <g font-size="12.5" fill="#d5dce8">
    <rect x="48" y="126" width="210" height="42" rx="6" fill="#151922" stroke="#2a3140"/>
    <text x="58" y="144" font-weight="700" fill="#9ecbff">Game Depot 1942281</text>
    <text x="58" y="160" font-size="11" fill="#8b96ab">Fetches only Brotato.pck (skips exe/dll)</text>

    <rect x="48" y="176" width="210" height="28" rx="6" fill="#151922" stroke="#2a3140"/>
    <text x="58" y="194">Steam Cloud Save Storage</text>

    <rect x="48" y="212" width="210" height="28" rx="6" fill="#151922" stroke="#2a3140"/>
    <text x="58" y="230">Achievements · Playtime · Presence</text>

    <rect x="48" y="248" width="210" height="28" rx="6" fill="#151922" stroke="#2a3140"/>
    <text x="58" y="266">DLC Ownership (2868390 / 4498220)</text>

    <rect x="48" y="284" width="210" height="28" rx="6" fill="#151922" stroke="#2a3140"/>
    <text x="58" y="302">Subscribed Workshop Items</text>
  </g>

  <!-- Column 2: JavaSteam Bridge -->
  <rect x="319" y="72" width="242" height="252" rx="12" fill="#1c212c" stroke="#2f8cff" stroke-width="1.5"/>
  <rect x="319" y="72" width="242" height="42" rx="12" fill="#1f4782"/>
  <text x="337" y="98" font-size="14.5" font-weight="800" fill="#ffffff">⚡ Launcher &amp; Steam Bridge (Java)</text>
  <g font-size="12.5" fill="#d5dce8">
    <text x="337" y="138" fill="#79c0ff" font-weight="700">• Depot download &amp; chunk delta updates</text>
    <text x="337" y="166">• Two-way Auto-Cloud save sync</text>
    <text x="337" y="194">• Checks DLCs &amp; pulls Workshop mods</text>
    <text x="337" y="222">• Reports playtime &amp; achievement unlocks</text>
    <text x="337" y="250">• Bottom-right Steam achievement toast</text>
    <rect x="335" y="270" width="210" height="38" rx="6" fill="#151922" stroke="#2c3a50"/>
    <text x="440" y="287" text-anchor="middle" font-size="11.5" font-weight="700" fill="#68f0b1">JavaSteam · WebSocket Only</text>
    <text x="440" y="302" text-anchor="middle" font-size="10.5" fill="#8b96ab">Domain routing works reliably with Clash TUN</text>
  </g>

  <!-- Column 3: Godot 3.6.2 -->
  <rect x="606" y="72" width="242" height="252" rx="12" fill="#1c212c" stroke="#3b7bb5" stroke-width="1.2"/>
  <rect x="606" y="72" width="242" height="42" rx="12" fill="#23486b"/>
  <text x="624" y="98" font-size="14.5" font-weight="800" fill="#a2d2ff">🎮 Official Godot 3.6.2 Android</text>
  <g font-size="12.5" fill="#d5dce8">
    <rect x="622" y="126" width="210" height="40" rx="6" fill="#151922" stroke="#2a3140"/>
    <text x="632" y="143" font-family="Consolas,monospace" font-size="11.5" fill="#ffb067">--main-pack</text>
    <text x="632" y="159" font-family="Consolas,monospace" font-size="11" fill="#8b96ab">user://game/Brotato.pck</text>

    <text x="624" y="188">• <tspan fill="#79c0ff">override.cfg</tspan> hooks first autoload</text>
    <text x="624" y="214">• <tspan fill="#79c0ff">boot.gd</tspan> mounts overlay.zip</text>
    <text x="636" y="232" font-size="11" fill="#8b96ab">Replaces PC steam.gd without modifying pck</text>
    <text x="624" y="256">• ModLoader reads <tspan font-family="Consolas,monospace" font-size="11.5">user://workshop</tspan></text>
    <text x="624" y="282">• Non-blocking cache reads on render thread</text>
  </g>

  <!-- Horizontal Arrows -->
  <line x1="278" y1="196" x2="314" y2="196" stroke="#58a6ff" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="565" y1="196" x2="601" y2="196" stroke="#58a6ff" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Bottom Storage Box -->
  <rect x="32" y="358" width="816" height="68" rx="12" fill="#231d18" stroke="#7d5329" stroke-width="1.2"/>
  <text x="50" y="384" font-size="13.5" font-weight="800" fill="#ffad5c">📁 On-Device Sandbox user:// (/data/data/dev.kmbrotato.brotato/files/)</text>
  <text x="50" y="408" font-size="12.5" fill="#dfb995">game/Brotato.pck (8B header patched to 3.6) · &lt;SteamID64&gt;/ saves (same layout as PC) · workshop/ mods · achievement icon cache</text>

  <!-- Vertical Storage Arrows -->
  <line x1="440" y1="326" x2="440" y2="354" stroke="#ff9e44" stroke-width="1.8" marker-end="url(#a2)"/>
  <line x1="727" y1="354" x2="727" y2="326" stroke="#ff9e44" stroke-width="1.8" marker-end="url(#a2)"/>
  <text x="448" y="345" font-size="11.5" font-weight="600" fill="#ffad5c">Write / Sync</text>
  <text x="735" y="345" font-size="11.5" font-weight="600" fill="#ffad5c">Native C Read</text>
</svg>
