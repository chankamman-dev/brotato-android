<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171f"/>
      <stop offset="100%" stop-color="#1b202b"/>
    </linearGradient>
    <linearGradient id="blueBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2b7fff"/>
      <stop offset="100%" stop-color="#53a0ff"/>
    </linearGradient>
    <linearGradient id="orangeBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff832b"/>
      <stop offset="100%" stop-color="#ffaa44"/>
    </linearGradient>
    <linearGradient id="greenPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#193829"/>
      <stop offset="100%" stop-color="#204935"/>
    </linearGradient>
  </defs>

  <rect width="880" height="350" rx="16" fill="url(#bg)" stroke="#2e3545" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="32" y="24" width="6" height="34" rx="3" fill="#ff8c38"/>
  <text x="50" y="42" font-size="18" font-weight="800" fill="#f3f5f8">Cold Launch: Icon Tap to Title Screen &amp; Cloud Save Loaded</text>
  <text x="50" y="61" font-size="12.5" fill="#8e99ad">Measured on AYN Thor (Snapdragon 8 Gen 2) · Signed in to Steam · No pending game patch</text>
  <rect x="704" y="27" width="144" height="28" rx="14" fill="url(#greenPill)" stroke="#38c985" stroke-width="1"/>
  <text x="776" y="45" text-anchor="middle" font-size="12.5" font-weight="700" fill="#68f0b1">⚡ 7.1× Faster</text>

  <!-- Grid lines: x0 = 230, 17.5 px per second -->
  <g font-size="11.5" fill="#7a8599" text-anchor="middle">
    <line x1="230" y1="88" x2="230" y2="276" stroke="#283040" stroke-width="1"/>
    <line x1="405" y1="88" x2="405" y2="276" stroke="#232a38" stroke-dasharray="4 4"/>
    <line x1="580" y1="88" x2="580" y2="276" stroke="#232a38" stroke-dasharray="4 4"/>
    <line x1="755" y1="88" x2="755" y2="276" stroke="#232a38" stroke-dasharray="4 4"/>
    <text x="230" y="294">0s</text>
    <text x="405" y="294">10s</text>
    <text x="580" y="294">20s</text>
    <text x="755" y="294">30s</text>
  </g>

  <!-- Row 1: v1 sequential -->
  <text x="32" y="114" font-size="14" font-weight="700" fill="#e2e7f0">Initial Build (Sequential)</text>
  <text x="32" y="133" font-size="11.5" fill="#8490a5">Sync all before boot + /data via JNI</text>
  <rect x="230" y="102" width="210" height="26" rx="5" fill="url(#blueBar)"/>
  <text x="335" y="119" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Steam Login + Cloud + Checks (12s)</text>
  <rect x="443" y="102" width="44" height="26" rx="5" fill="#465063"/>
  <rect x="490" y="102" width="300" height="26" rx="5" fill="url(#orangeBar)"/>
  <text x="640" y="119" text-anchor="middle" font-size="11" font-weight="600" fill="#1b130a">Godot reading /data pack via Java JNI (17.5s)</text>
  <text x="802" y="120" font-size="14" font-weight="800" fill="#ff7b72">32 s</text>

  <!-- Row 2: user:// fixed -->
  <text x="32" y="176" font-size="14" font-weight="700" fill="#e2e7f0">After Fixing Pack Path</text>
  <text x="32" y="195" font-size="11.5" fill="#8490a5">Native C FileAccessUnix via user://</text>
  <rect x="230" y="164" width="220" height="26" rx="5" fill="url(#blueBar)"/>
  <text x="340" y="181" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Launcher Sync (12.6s)</text>
  <rect x="453" y="164" width="60" height="26" rx="5" fill="url(#orangeBar)"/>
  <text x="483" y="181" text-anchor="middle" font-size="11" font-weight="700" fill="#1b130a">3.4s</text>
  <text x="525" y="182" font-size="14" font-weight="800" fill="#f0c674">16 s</text>

  <!-- Row 3: current parallel -->
  <rect x="20" y="212" width="840" height="54" rx="10" fill="#1c2726" stroke="#2c5949" stroke-width="1"/>
  <text x="32" y="236" font-size="14" font-weight="800" fill="#68f0b1">Current Build (Parallel)</text>
  <text x="32" y="255" font-size="11.5" fill="#88bfa6">Skips splash · Cloud sync overlaps load</text>
  <rect x="230" y="222" width="79" height="14" rx="4" fill="url(#blueBar)"/>
  <rect x="230" y="241" width="68" height="14" rx="4" fill="url(#orangeBar)"/>
  <rect x="300" y="241" width="9" height="14" rx="2" fill="none" stroke="#ffaa44" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="322" y="245" font-size="15" font-weight="800" fill="#68f0b1">4.5 s</text>
  <text x="374" y="244" font-size="11.5" fill="#98c9b3">(Waits for Cloud saves right before reading; DLC &amp; Workshop sync in background)</text>

  <!-- Legend -->
  <g font-size="12" fill="#a9b3c6">
    <rect x="150" y="315" width="13" height="13" rx="3" fill="url(#blueBar)"/>
    <text x="170" y="326">Steam Login &amp; Cloud Sync</text>
    <rect x="350" y="315" width="13" height="13" rx="3" fill="#465063"/>
    <text x="370" y="326">"Ready" Splash Pause</text>
    <rect x="520" y="315" width="13" height="13" rx="3" fill="url(#orangeBar)"/>
    <text x="540" y="326">Godot Engine Load (dashed: waiting for cloud save)</text>
  </g>
</svg>
